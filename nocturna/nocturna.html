<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rueda Nocturna</title>
     <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

    
<section class="bg-[#172a3a] text-white px-6 py-20 md:px-16 md:py-28">

    <div class="max-w-6xl mx-auto border-4 border-[#f7b97c] 
                bg-[#114f31] p-8 md:p-14
                shadow-[12px_12px_0px_#f7b97c]">

        <p class="inline-block bg-[#f7b97c] text-[#172a3a]
                  border-2 border-[#172a3a] px-4 py-2
                  font-black uppercase tracking-wider mb-8">
            Nuevo · Jueves a sábado
        </p>

        <h1 class="text-5xl md:text-8xl font-black uppercase
                   tracking-tighter text-[#f7b97c] mb-6">
            Rueda<br> Nocturna
        </h1>

        <p class="text-lg md:text-2xl font-bold
                  max-w-2xl text-white mb-10">
            Descubre Medellín en bici cuando se encienden las luces.
        </p>

        <ul class="flex flex-wrap gap-4 mb-10">

            <li class="bg-white text-[#172a3a] border-2
                       border-[#172a3a] px-5 py-3
                       font-black shadow-[4px_4px_0px_#f7b97c]">
                3 RUTAS
            </li>

            <li class="bg-[#f7b97c] text-[#172a3a] border-2
                       border-[#172a3a] px-5 py-3
                       font-black shadow-[4px_4px_0px_#ffffff]">
                DESDE $55.000
            </li>

        </ul>

        <a href="#inscripcion"
           class="inline-block bg-[#f7b97c] text-[#172a3a]
                  border-4 border-[#172a3a] px-8 py-4
                  text-xl font-black uppercase
                  shadow-[7px_7px_0px_#ffffff]
                  ">
            Inscribirse
        </a>

    </div>

</section>



<a href="#inscripcion"
   class="inline-block bg-[#f7b97c] text-[#172a3a]
          border-4 border-[#172a3a] px-8 py-4
          font-black text-lg uppercase
          shadow-[7px_7px_0px_#114f31]
          hover:translate-x-1 hover:translate-y-1
          hover:shadow-[3px_3px_0px_#114f31]
          hover:bg-[#e26d23]
          focus-visible:outline-none
          focus-visible:ring-4
          focus-visible:ring-[#ffffff]
          focus-visible:ring-offset-4
          focus-visible:ring-offset-[#172a3a]
          ">
    Inscrite
</a>

<a href="#rutas"
   class="inline-block bg-[#114f31] text-white
          border-4 border-white px-8 py-4
          font-black text-lg uppercase
          shadow-[7px_7px_0px_#f7b97c]
          hover:bg-[#f7b97c] hover:text-[#172a3a]
          hover:translate-x-1 hover:translate-y-1
          hover:shadow-[3px_3px_0px_#f7b97c]
          focus-visible:outline-none
          focus-visible:ring-4
          focus-visible:ring-[#f7b97c]
          focus-visible:ring-offset-4
          focus-visible:ring-offset-[#172a3a]
          ">
    Ver las rutas
</a>

<a href="#informacion"
   class="inline-block bg-white text-[#172a3a]
          border-4 border-[#172a3a] px-8 py-4
          font-black text-lg uppercase
          shadow-[7px_7px_0px_#e26d23]
          hover:bg-[#172a3a] hover:text-white
          hover:border-white
          hover:translate-x-1 hover:translate-y-1
          hover:shadow-[3px_3px_0px_#e26d23]
          focus-visible:outline-none
          focus-visible:ring-4
          focus-visible:ring-[#e26d23]
          focus-visible:ring-offset-4
          focus-visible:ring-offset-white
         ">
    Mas informacion
</a>




</body>
</html>
